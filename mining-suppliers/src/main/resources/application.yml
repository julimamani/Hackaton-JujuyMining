spring:
  application:
    name: mining-suppliers
  profiles:
    default: h2
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
  # IA local con Ollama (no requiere API key)
  ai:
    # No reintentar 10 veces si Ollama está colgado: una sola llamada + timeout.
    retry:
      max-attempts: 1
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1:8b
          temperature: 0.0
          # Respuestas cortas (solo el JSON de filtros): menos latencia.
          num-predict: 160
  # Si Ollama se cuelga, no dejamos la petición HTTP abierta indefinidamente.
  http:
    client:
      connect-timeout: 2s
      read-timeout: 15s

server:
  port: 8080

app:
  certification:
    expiring-soon-days: 60
  cors:
    allowed-origins: http://localhost:4200,http://localhost:3000,http://localhost:5173

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:miningdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/miningdb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
